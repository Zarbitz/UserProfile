name: zarbitz
services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: zarbitz
      POSTGRES_USER: zarbitz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U zarbitz -d zarbitz"]
      interval: 5s
      retries: 12
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://zarbitz:${POSTGRES_PASSWORD}@db:5432/zarbitz
      ZARR_ROOT: /data
      NODE_ENV: production
    ports:
      - 127.0.0.1:8080:8080
    volumes:
      - ../Web/dist:/platforms/web:ro
      - ../Agri:/platforms/agri:ro
      - ../Dams/dist:/platforms/dams:ro
      - ../Building:/platforms/building:ro
      - ${ZARR_HOST_PATH:-./data}:/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://localhost:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      retries: 3
  tunnel:
    image: cloudflare/cloudflared:latest
    profiles: [public]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [app]
volumes:
  postgres:
